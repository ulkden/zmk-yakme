# Monthly, grouped updates keep maintenance light. Security updates are raised as soon as advisories appear.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    labels: [dependencies]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
    labels: [dependencies]
    commit-message:
      prefix: chore(actions)
