<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Content-Security-Policy: only this site's own scripts, styles and fonts; network access only to
      GitHub (URL / repository import). Keep in sync with ALLOWED_HOSTS in src/core/github.js.
      style-src allows 'unsafe-inline' only because WebKit (Safari) applies an internal stylesheet to
      <select> controls that a strict style-src blocks. Scripts stay strict ('self' only).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src https://api.github.com https://raw.githubusercontent.com https://gist.githubusercontent.com; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="dark" />
    <title>ZMK Keymap Editor</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body class="empty">
    <header class="topbar">
      <div class="brand">⌨ ZMK Keymap Editor</div>
      <nav id="toolbar" class="toolbar"></nav>
    </header>
    <main class="workspace">
      <section class="center">
        <div id="welcome"></div>
        <div id="tabs" class="tabs"></div>
        <div id="keyboard" class="keyboard"></div>
        <div id="palette" class="palette"></div>
      </section>
      <aside id="inspector" class="inspector"></aside>
    </main>
    <footer id="status" class="status"></footer>
    <div id="drop-overlay"><div>Drop layout or keymap files to import</div></div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
